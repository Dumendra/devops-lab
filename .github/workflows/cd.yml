name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (usually the commit SHA published by CI)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests
        run: kubectl apply -k k8s

      - name: Update image
        run: |
          kubectl -n devops-lab set image deployment/devops-lab-api \
            api=ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.image_tag }}

      - name: Wait for rollout
        run: kubectl -n devops-lab rollout status deployment/devops-lab-api --timeout=120s
